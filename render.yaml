# Express serves dist/client and the payment API from one HTTPS origin.
# Free service: no persistent disk; sandbox payment data is ephemeral.
services:
  - type: web
    name: blueprint-operativo-ecommerce-chile
    runtime: node
    plan: free
    region: oregon
    numInstances: 1
    buildCommand: corepack enable && corepack prepare pnpm@11.19.0 --activate && pnpm install --frozen-lockfile --prod=false && pnpm typecheck && PAYMENT_ENV=sandbox WEBPAY_COMMERCE_CODE= WEBPAY_API_KEY= APP_URL=http://localhost:3000 pnpm test:unit && pnpm build
    startCommand: NODE_ENV=production node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22.22.0'
      - key: NODE_ENV
        value: production
      - key: PAYMENT_ENV
        value: sandbox
      - key: PAYMENT_TIMEOUT_MS
        value: '10000'
      - key: WEBPAY_COMMERCE_CODE
        sync: false
      - key: WEBPAY_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_TIMEOUT_MS
        value: '12000'
      - key: GEMINI_COOLDOWN_MS
        value: '60000'
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: EVENTS_API_TOKEN
        generateValue: true
# APP_URL defaults to Render's RENDER_EXTERNAL_URL (HTTPS).
# For a custom domain, set APP_URL=https://your-domain in the dashboard.
# Callback: APP_URL/api/webhooks/payment (GET/POST); no wildcard CORS.
