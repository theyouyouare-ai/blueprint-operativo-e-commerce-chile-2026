# Express serves dist/client and the payment API from one HTTPS origin.
# Paid production-ready service with persistent Webpay disk and private Redis.
services:
  - type: web
    name: blueprint-operativo-ecommerce-chile
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    numInstances: 1
    disk:
      name: payments
      mountPath: /var/data/payments
      sizeGB: 1
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm typecheck && PAYMENT_ENV=sandbox WEBPAY_COMMERCE_CODE= WEBPAY_API_KEY= MERCADOPAGO_ACCESS_TOKEN= APP_URL=http://localhost:3000 pnpm test:unit && pnpm build
    startCommand: NODE_ENV=production node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22.22.0'
      - key: NODE_ENV
        value: production
      - key: PAYMENT_ENV
        value: sandbox
      - key: PAYMENT_TIMEOUT_MS
        value: '10000'
      - key: PAYMENT_STORE_DIR
        value: /var/data/payments
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          name: blueprint-payments-redis
          type: keyvalue
          property: connectionString
      - key: WEBPAY_COMMERCE_CODE
        sync: false
      - key: WEBPAY_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_TIMEOUT_MS
        value: '12000'
      - key: GEMINI_COOLDOWN_MS
        value: '60000'
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: EVENTS_API_TOKEN
        generateValue: true
# APP_URL defaults to Render's RENDER_EXTERNAL_URL (HTTPS).
# For a custom domain, set APP_URL=https://your-domain in the dashboard.
# Callback: APP_URL/api/webhooks/payment (GET/POST); no wildcard CORS.

  - type: keyvalue
    name: blueprint-payments-redis
    plan: 256mb
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []
